,"name":"Dinner at the Zoo","url":"https:\/\/www.dinneratthezoo.com\/","logo":{"@type":"ImageObject","inLanguage":"en-US","@id":"https:\/\/www.dinneratthezoo.com\/#\/schema\/logo\/image\/","url":"https:\/\/www.dinneratthezoo.com\/wp-content\/uploads\/2026\/04\/DatZ-logo-stacked-color-RGB-SQUARE-YOAST_696.jpg","contentUrl":"https:\/\/www.dinneratthezoo.com\/wp-content\/uploads\/2026\/04\/DatZ-logo-stacked-color-RGB-SQUARE-YOAST_696.jpg","width":696,"height":696,"caption":"Dinner at the Zoo"},"image":{"@id":"https:\/\/www.dinneratthezoo.com\/#\/schema\/logo\/image\/"},"sameAs":["http:\/\/www.facebook.com\/dinneratthezoo","https:\/\/x.com\/dinneratthezoo","http:\/\/www.instagram.com\/dinneratthezoo","http:\/\/www.pinterest.com\/dinneratthezoo"]},{"@type":"Person","@id":"https:\/\/www.dinneratthezoo.com\/#\/schema\/person\/3874ff1c9d558166e703ec4f11f11190","name":"Sara Welch","image":{"@type":"ImageObject","inLanguage":"en-US","@id":"https:\/\/secure.gravatar.com\/avatar\/008b9a079f72a6cc33350130cf7f24feb9662a4ff3c0b86432495a1547c4addf?s=96&d=mm&r=g","url":"https:\/\/secure.gravatar.com\/avatar\/008b9a079f72a6cc33350130cf7f24feb9662a4ff3c0b86432495a1547c4addf?s=96&d=mm&r=g","contentUrl":"https:\/\/secure.gravatar.com\/avatar\/008b9a079f72a6cc33350130cf7f24feb9662a4ff3c0b86432495a1547c4addf?s=96&d=mm&r=g","caption":"Sara Welch"},"sameAs":["https:\/\/www.dinneratthezoo.com\/about-me-contact-info\/"]},{"@type":"Question","@id":"https:\/\/www.dinneratthezoo.com\/smoked-turkey-recipe\/#faq-question-1671225432633","position":1,"url":"https:\/\/www.dinneratthezoo.com\/smoked-turkey-recipe\/#faq-question-1671225432633","name":"How long does it take to smoke a turkey?","answerCount":1,"acceptedAnswer":{"@type":"Answer","text":"Smoking a turkey can be a long process, so be sure to start early in the day so that the turkey will be done by dinner time. Typically, it takes at least 5 hours to smoke an average sized turkey at 250 degrees F. Plan on having your turkey cook for about 25-30 minutes per pound. This timing can vary somewhat depending on the type of smoker you're using and how well it holds the temperature steady. It's imperative to use a thermometer rather than a clock to gauge when the turkey is ready.","inLanguage":"en-US"},"inLanguage":"en-US"},{"@type":"Question","@id":"https:\/\/www.dinneratthezoo.com\/smoked-turkey-recipe\/#faq-question-1671225443102","position":2,"url":"https:\/\/www.dinneratthezoo.com\/smoked-turkey-recipe\/#faq-question-1671225443102","name":"What type of wood is best for smoking a turkey?","answerCount":1,"acceptedAnswer":{"@type":"Answer","text":"I like to use apple wood to smoke poultry, as it imparts a mild and sweet flavor. Apple wood is readily available in most stores. Other great choices are cherry wood or hickory.","inLanguage":"en-US"},"inLanguage":"en-US"},{"@type":"Question","@id":"https:\/\/www.dinneratthezoo.com\/smoked-turkey-recipe\/#faq-question-1671225463668","position":3,"url":"https:\/\/www.dinneratthezoo.com\/smoked-turkey-recipe\/#faq-question-1671225463668","name":"When is a smoked turkey done?","answerCount":1,"acceptedAnswer":{"@type":"Answer","text":"A turkey is done when a thermometer inserted into the thickest part of the thigh registers 165 degrees F. I use a digital thermometer that I leave in the turkey while it smokes so I can monitor the progress with a temperature remote from the house.","inLanguage":"en-US"},"inLanguage":"en-US"},{"@type":"Question","@id":"https:\/\/www.dinneratthezoo.com\/smoked-turkey-recipe\/#faq-question-1671225480930","position":4,"url":"https:\/\/www.dinneratthezoo.com\/smoked-turkey-recipe\/#faq-question-1671225480930","name":"Do you have to baste a turkey?","answerCount":1,"acceptedAnswer":{"@type":"Answer","text":"I prefer to baste my smoked turkey because no one wants a dry turkey! I occasionally baste the turkey with a little chicken broth as it cooks to ensure a moist end result. If you've <a href=\"https:\/\/www.dinneratthezoo.com\/turkey-brine-recipe\/\">brined<\/a> your turkey before hand, you can skip the basting step.","inLanguage":"en-US"},"inLanguage":"en-US"},{"@type":"Question","@id":"https:\/\/www.dinneratthezoo.com\/smoked-turkey-recipe\/#faq-question-1671225507009","position":5,"url":"https:\/\/www.dinneratthezoo.com\/smoked-turkey-recipe\/#faq-question-1671225507009","name":"How much turkey per person?","answerCount":1,"acceptedAnswer":{"@type":"Answer","text":"You can estimate the size of turkey that you need by planning on one pound of turkey per person. If you want a lot of turkey left over, plan on 1 1\/2 pounds of turkey per person.","inLanguage":"en-US"},"inLanguage":"en-US"},{"@type":"Recipe","name":"Smoked Turkey Recipe","author":{"@id":"https:\/\/www.dinneratthezoo.com\/#\/schema\/person\/3874ff1c9d558166e703ec4f11f11190"},"description":"This smoked turkey recipe is a whole turkey that's coated in homemade spice rub then slow smoked to tender and juicy perfection. A super easy and impressive holiday main course that won't take up any oven space!","datePublished":"2022-12-16T15:18:00+00:00","image":["https:\/\/www.dinneratthezoo.com\/wp-content\/uploads\/2018\/10\/smoked-turkey-final-1-2.jpg","https:\/\/www.dinneratthezoo.com\/wp-content\/uploads\/2018\/10\/smoked-turkey-final-1-2-500x500.jpg","https:\/\/www.dinneratthezoo.com\/wp-content\/uploads\/2018\/10\/smoked-turkey-final-1-2-500x375.jpg","https:\/\/www.dinneratthezoo.com\/wp-content\/uploads\/2018\/10\/smoked-turkey-final-1-2-480x270.jpg"],"recipeYield":["12"],"prepTime":"PT10M","cookTime":"PT360M","totalTime":"PT370M","recipeIngredient":["1 recipe turkey brine (optional, if you choose to brine your turkey, you can skip the chicken broth basting)","12 lb whole turkey (giblets and neck removed)","1\/2 cup BBQ rub","1 onion (quartered)","1 lemon (quartered)","4 sprigs fresh herbs (such as thyme, rosemary or parsley)","3 cups chicken broth (use if not brining your turkey)","fresh herbs for garnish","cooking spray"],"recipeInstructions":[{"@type":"HowToStep","text":"Prepare the brine according to recipe directions if you decide to brine your turkey. Let the turkey soak in the brine for 18-24 hours before cooking.","name":"Prepare the brine according to recipe directions if you decide to brine your turkey. Let the turkey soak in the brine for 18-24 hours before cooking.","url":"https:\/\/www.dinneratthezoo.com\/smoked-turkey-recipe\/#wprm-recipe-18055-step-0-0"},{"@type":"HowToStep","text":"Preheat the smoker to 250 degrees F. Load the smoker with apple wood.","name":"Preheat the smoker to 250 degrees F. Load the smoker with apple wood.","url":"https:\/\/www.dinneratthezoo.com\/smoked-turkey-recipe\/#wprm-recipe-18055-step-0-1"},{"@type":"HowToStep","text":"Coat a large disposable aluminum pan with cooking spray. Place the turkey in the pan and tuck the wings under the body.","name":"Coat a large disposable aluminum pan with cooking spray. Place the turkey in the pan and tuck the wings under the body.","url":"https:\/\/www.dinneratthezoo.com\/smoked-turkey-recipe\/#wprm-recipe-18055-step-0-2"},{"@type":"HowToStep","text":"Stuff the cavity of the turkey with the onion, lemon and herbs, then use kitchen twine to tie the legs together.","name":"Stuff the cavity of the turkey with the onion, lemon and herbs, then use kitchen twine to tie the legs together.","url":"https:\/\/www.dinneratthezoo.com\/smoked-turkey-recipe\/#wprm-recipe-18055-step-0-3"},{"@type":"HowToStep","text":"Sprinkle the BBQ rub all over the surface of the turkey.","name":"Sprinkle the BBQ rub all over the surface of the turkey.","url":"https:\/\/www.dinneratthezoo.com\/smoked-turkey-recipe\/#wprm-recipe-18055-step-0-4"},{"@type":"HowToStep","text":"Place the turkey in the smoker. Cook for 5-6 hours, basting with chicken broth every 30-45 minutes, until a thermometer inserted into the thickest part of the thigh registers 165 degrees F.  If you brine your turkey, you don&#39;t need to baste it. Refill the wood chips as needed.","name":"Place the turkey in the smoker. Cook for 5-6 hours, basting with chicken broth every 30-45 minutes, until a thermometer inserted into the thickest part of the thigh registers 165 degrees F.  If you brine your turkey, you don&#39;t need to baste it. Refill the wood chips as needed.","url":"https:\/\/www.dinneratthezoo.com\/smoked-turkey-recipe\/#wprm-recipe-18055-step-0-5"},{"@type":"HowToStep","text":"If the turkey starts to get too dark, cover it with foil.","name":"If the turkey starts to get too dark, cover it with foil.","url":"https:\/\/www.dinneratthezoo.com\/smoked-turkey-recipe\/#wprm-recipe-18055-step-0-6"},{"@type":"HowToStep","text":"Let the turkey rest for 10-15 minutes then transfer to a serving plate. Garnish with herbs if desired, then serve.","name":"Let the turkey rest for 10-15 minutes then transfer to a serving plate. Garnish with herbs if desired, then serve.","url":"https:\/\/www.dinneratthezoo.com\/smoked-turkey-recipe\/#wprm-recipe-18055-step-0-7"}],"aggregateRating":{"@type":"AggregateRating","ratingValue":"5","ratingCount":"99","reviewCount":"8"},"review":[{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"I have made this recipe twice now. Both times it has gotten to 160 in less than 4 hours. I moved it to a 170 degree oven to keep warm. I use poultry tables that list appropriate time\/temperature at various levels, and I didn't intend for my bird to get up to 160. But it was so delicious and tender... the two times I made turkey this way our most tender and flavorful turkey experiences ever!! \r\n\r\nI used your linked brine recipe, I personally think brining is an important part of the forumula for success. That may also account for the shorter cooking time since you never open the smoker door to baste (opening the smoker door on a cold day immediately drops the temperature between 50 and 150 degrees!). \r\n\r\nI found a gravy recipe online. The gravy was fantastic, but fortunately I was able to add an additional cup of water without it becoming too watery. If I hadn't been able to add an extra cup of water, it would have been inedible, because these drippings are highly flavorful and salty with the rub!!\r\n\r\nThank you","author":{"@type":"Person","name":"Tanya W"},"datePublished":"2026-01-18"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Excellent recipe.  I have some experience with my electric smoker which helped, but not with a 14 lb turkey.  It's the first time I brined a turkey and I will definitely be doing that going forward.  I used a Kinder brining kit since it came with a bag to contain the brine.  The flavor from the Kinder brine is very good but it's raised my awareness of brining so I might experiment with this recipe next time.  I used a cowboy dry rub which I make myself.  It is similar to what is recommended in this recipe.  I also did the lemon, onion, fresh rosemary &amp; sage.  \nTake care to insert the thermometer probe in the correct place otherwise you might think it is cooking faster than it is.  Next time I will insert the thermometer probe and let turkey (or chicken) come up in temperature, then reinsert find the coolest part for the thermometer probe. I will also baste it a couple of times next time.","author":{"@type":"Person","name":"Greg"},"datePublished":"2025-12-02"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Best turkey we've ever had! I don't know if it was the brining or smoker, but so very moist! I made a Cajun seasoning which was perfect! Thank you!","author":{"@type":"Person","name":"Ellen J Roberts"},"datePublished":"2025-11-27"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Tried this recipe for the Thanksgiving turkey and it was such a hit that it’s been requested that I smoke the Christmas bird as well. I did use some thinly sliced oranges, honey crisp apples, garlic and onion to stuff the bird with.","author":{"@type":"Person","name":"BC"},"datePublished":"2024-12-21"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"What a winner!  By far,my best ever turkey. The breast and dark meat were perfect. I didn’t brine. Just basted and followed the instructions.  I pulled it when the thigh reached 158F and tented with foil for 15 minutes.","author":{"@type":"Person","name":"Dee"},"datePublished":"2024-11-28"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"I'm smoking a 19.76 pound turkey (first time smoker). My electric smoker only goes to 250 degrees. What would be the estimated cook time(I know to always use a meat thermometer) and am I pushing the \"safety zone\" for properly and SAFELY cooking the bird?","author":{"@type":"Person","name":"Tammy"},"datePublished":"2024-06-07"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"First time making a smoked turkey.  I didn't have apple cider but used apple juice.  Also my turkey was over 16 pounds.  I didn't have a pot big enough for the full 2 quarts of water.  Everything said, it turned out amazing!  Everyone commented how juicy it was.  Definitely keeping this recipe.","author":{"@type":"Person","name":"Monica"},"datePublished":"2024-05-22"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Wonderful results! My bird was 13 pounds and took 6 hours. The meat was juicy and tender. \r\nWe used the recommended brine and run. I ran out of lemon and stuffed with garlic, oranges, onions, rosemary and parsley.","author":{"@type":"Person","name":"Eva Madsen"},"datePublished":"2023-12-30"}],"recipeCategory":["Main"],"recipeCuisine":["American"],"keywords":"smoked turkey","nutrition":{"@type":"NutritionInformation","calories":"363 kcal","carbohydrateContent":"1 g","proteinContent":"70 g","fatContent":"16 g","saturatedFatContent":"4 g","cholesterolContent":"231 mg","sodiumContent":"576 mg","servingSize":"1 serving"},"@id":"https:\/\/www.dinneratthezoo.com\/smoked-turkey-recipe\/#recipe","isPartOf":{"@id":"https:\/\/www.dinneratthezoo.com\/smoked-turkey-recipe\/#article"},"mainEntityOfPage":"https:\/\/www.dinneratthezoo.com\/smoked-turkey-recipe\/"}]}</script>
